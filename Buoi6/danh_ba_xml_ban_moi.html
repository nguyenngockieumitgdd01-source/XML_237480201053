<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh bạ XML - Thêm, Đọc, Sửa, Xóa</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 24px auto; padding: 0 14px; max-width: 850px; background: #f4f4f9; color: #222; }
    h2 { color: #2c3e50; }
    .section, .card { background: #fff; padding: 16px; margin-bottom: 16px; border-radius: 8px; box-shadow: 0 2px 5px #00000012; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: inline-block; width: 125px; font-weight: bold; }
    .form-group input { padding: 8px; width: min(100%, 360px); border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 12px; border: 0; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 3px; }
    button:hover { opacity: .88; }
    .btn-add { background: #27ae60; color: white; }
    .btn-display, .btn-read { background: #3498db; color: white; }
    .btn-edit { background: #f39c12; color: white; }
    .btn-delete { background: #e74c3c; color: white; }
    .btn-download { background: #8e44ad; color: white; }
    .btn-save { background: #16a085; color: white; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .name { font-size: 1.1em; font-weight: bold; color: #2c3e50; margin-bottom: 8px; }
    .badge { background: #3498db; color: white; padding: 3px 8px; border-radius: 12px; font-size: .8em; margin-left: 5px; }
    .empty { color: #777; font-style: italic; }
    #status { margin-top: 10px; color: #2c3e50; }
    .form-actions { margin-top: 8px; }
</style>
</head>
<body>
<h2>Danh bạ cá nhân XML</h2>

<div class="section">
    <h3 id="form-title">➕ Thêm liên hệ mới</h3>
    <form id="contact-form">
        <input type="hidden" id="input-id">
        <div class="form-group"><label for="input-name">Họ và tên:</label><input id="input-name" required placeholder="Nhập tên..."></div>
        <div class="form-group"><label for="input-phone">Số điện thoại:</label><input id="input-phone" type="tel" required placeholder="Nhập SĐT..."></div>
        <div class="form-group"><label for="input-email">Email:</label><input id="input-email" type="email" required placeholder="Nhập email..."></div>
        <div class="form-group"><label for="input-group">Nhóm:</label><input id="input-group" required placeholder="Công việc, Gia đình..."></div>
        <div class="form-actions">
            <button type="submit" class="btn-add" id="submit-btn">Thêm vào danh bạ</button>
            <button type="button" onclick="cancelEdit()">Hủy sửa</button>
        </div>
    </form>
</div>

<div class="section">
    <h3>📂 Đọc tập tin XML</h3>
    <p>Chọn tập tin XML có cấu trúc <code>&lt;directory&gt;&lt;contact&gt;...&lt;/contact&gt;&lt;/directory&gt;</code>.</p>
    <div class="toolbar">
        <input type="file" id="xml-file" accept=".xml,text/xml,application/xml">
        <button class="btn-read" type="button" onclick="openXMLFileForEditing()">Mở file XML để đọc và lưu</button>
        <button class="btn-read" type="button" onclick="readXMLFile()">Đọc file đã chọn</button>
        <button class="btn-save" type="button" onclick="saveXMLToOpenedFile()">💾 Lưu vào file đã đọc</button>
        <button class="btn-download" type="button" onclick="downloadXML()">Tải file XML</button>
    </div>
    <div id="status" role="status"></div>
</div>

<div class="section">
    <label for="group-select"><strong>Lọc nhóm: </strong></label>
    <select id="group-select" onchange="displayContacts()">
        <option value="ALL">Tất cả nhóm</option>
    </select>
</div>

<div id="contact-list"><p class="empty">Đang tải dữ liệu...</p></div>

<script>
let xmlString = `<?xml version="1.0" encoding="UTF-8"?>
<directory>
    <contact id="1"><name>Nguyễn Văn A</name><phone>0901234567</phone><email>nva@gmail.com</email><group>Công việc</group></contact>
    <contact id="2"><name>Trần Thị B</name><phone>0987654321</phone><email>ttb@gmail.com</email><group>Gia đình</group></contact>
</directory>`;

const parser = new DOMParser();
let xmlDoc = parser.parseFromString(xmlString, "text/xml");
let contactIdCounter = 3;
let showDetails = true;
// File handle chỉ có khi mở file bằng nút "Mở file XML để đọc và lưu" trên trình duyệt hỗ trợ.
let openedFileHandle = null;

function getText(contact, tag) {
    const node = contact.getElementsByTagName(tag)[0];
    return node ? node.textContent : "";
}
function setStatus(message) {
    document.getElementById("status").textContent = message;
}
function updateGroupFilter() {
    const select = document.getElementById("group-select");
    const previous = select.value;
    const groups = [...new Set(Array.from(xmlDoc.getElementsByTagName("contact")).map(c => getText(c, "group")))];
    select.innerHTML = '<option value="ALL">Tất cả nhóm</option>';
    groups.filter(Boolean).forEach(group => {
        const option = document.createElement("option");
        option.value = group;
        option.textContent = group;
        select.appendChild(option);
    });
    select.value = groups.includes(previous) ? previous : "ALL";
}
function displayContacts() {
    updateGroupFilter();
    const selectedGroup = document.getElementById("group-select").value;
    const list = document.getElementById("contact-list");
    list.innerHTML = "";
    const contacts = Array.from(xmlDoc.getElementsByTagName("contact"));
    const filtered = contacts.filter(c => selectedGroup === "ALL" || getText(c, "group") === selectedGroup);

    if (!filtered.length) {
        list.innerHTML = '<p class="empty">Không có liên hệ nào trong nhóm này.</p>';
        return;
    }
    filtered.forEach(contact => {
        const id = contact.getAttribute("id");
        const card = document.createElement("div");
        card.className = "card";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = getText(contact, "name");
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = getText(contact, "group");
        name.appendChild(badge);
        card.appendChild(name);

        const phone = document.createElement("div");
        phone.textContent = "📞 SĐT: " + getText(contact, "phone");
        const email = document.createElement("div");
        email.textContent = "✉️ Email: " + getText(contact, "email");
        card.append(phone, email);

        const actions = document.createElement("div");
        actions.className = "form-actions";
        const readButton = document.createElement("button");
        readButton.className = "btn-read";
        readButton.textContent = "Đọc";
        readButton.onclick = () => readContact(id);
        const editButton = document.createElement("button");
        editButton.className = "btn-edit";
        editButton.textContent = "Sửa";
        editButton.onclick = () => editContact(id);
        const deleteButton = document.createElement("button");
        deleteButton.className = "btn-delete";
        deleteButton.textContent = "Xóa";
        deleteButton.onclick = () => deleteContact(id);
        actions.append(readButton, editButton, deleteButton);
        card.appendChild(actions);
        list.appendChild(card);
    });
}
function findContact(id) {
    return Array.from(xmlDoc.getElementsByTagName("contact")).find(c => c.getAttribute("id") === String(id));
}
function readContact(id) {
    const contact = findContact(id);
    if (!contact) return alert("Không tìm thấy liên hệ!");
    alert("Thông tin liên hệ\nHọ tên: " + getText(contact, "name") +
        "\nSố điện thoại: " + getText(contact, "phone") +
        "\nEmail: " + getText(contact, "email") +
        "\nNhóm: " + getText(contact, "group"));
}
function addOrUpdateContact(event) {
    event.preventDefault();
    const id = document.getElementById("input-id").value;
    const values = {
        name: document.getElementById("input-name").value.trim(),
        phone: document.getElementById("input-phone").value.trim(),
        email: document.getElementById("input-email").value.trim(),
        group: document.getElementById("input-group").value.trim()
    };
    if (id) {
        const contact = findContact(id);
        if (!contact) return alert("Không tìm thấy liên hệ cần sửa!");
        Object.entries(values).forEach(([tag, value]) => {
            let node = contact.getElementsByTagName(tag)[0];
            if (!node) { node = xmlDoc.createElement(tag); contact.appendChild(node); }
            node.textContent = value;
        });
        setStatus("Đã cập nhật thông tin liên hệ.");
    } else {
        const contact = xmlDoc.createElement("contact");
        contact.setAttribute("id", String(contactIdCounter++));
        Object.entries(values).forEach(([tag, value]) => {
            const node = xmlDoc.createElement(tag);
            node.textContent = value;
            contact.appendChild(node);
        });
        xmlDoc.documentElement.appendChild(contact);
        setStatus("Đã thêm liên hệ thành công.");
    }
    document.getElementById("contact-form").reset();
    document.getElementById("input-id").value = "";
    document.getElementById("form-title").textContent = "➕ Thêm liên hệ mới";
    document.getElementById("submit-btn").textContent = "Thêm vào danh bạ";
    displayContacts();
}
function editContact(id) {
    const contact = findContact(id);
    if (!contact) return alert("Không tìm thấy liên hệ!");
    document.getElementById("input-id").value = id;
    document.getElementById("input-name").value = getText(contact, "name");
    document.getElementById("input-phone").value = getText(contact, "phone");
    document.getElementById("input-email").value = getText(contact, "email");
    document.getElementById("input-group").value = getText(contact, "group");
    document.getElementById("form-title").textContent = "✏️ Sửa thông tin liên hệ";
    document.getElementById("submit-btn").textContent = "Lưu thay đổi";
    document.getElementById("input-name").focus();
    window.scrollTo({top: 0, behavior: "smooth"});
}
function cancelEdit() {
    document.getElementById("contact-form").reset();
    document.getElementById("input-id").value = "";
    document.getElementById("form-title").textContent = "➕ Thêm liên hệ mới";
    document.getElementById("submit-btn").textContent = "Thêm vào danh bạ";
}
function deleteContact(id) {
    const contact = findContact(id);
    if (!contact) return alert("Không tìm thấy liên hệ!");
    if (!confirm("Bạn có chắc muốn xóa liên hệ \"" + getText(contact, "name") + "\" không?")) return;
    contact.parentNode.removeChild(contact);
    displayContacts();
    setStatus("Đã xóa liên hệ.");
}
async function openXMLFileForEditing() {
    if (!window.showOpenFilePicker) {
        alert("Trình duyệt này chưa hỗ trợ lưu trực tiếp vào file đã mở. Hãy dùng Chrome hoặc Edge mới, hoặc chọn file bằng ô bên cạnh rồi dùng nút Tải file XML để lưu bản cập nhật.");
        return;
    }
    try {
        const handles = await window.showOpenFilePicker({
            multiple: false,
            types: [{ description: "Tập tin XML", accept: { "application/xml": [".xml"], "text/xml": [".xml"] } }]
        });
        if (!handles || !handles.length) return;
        const handle = handles[0];
        const file = await handle.getFile();
        const text = await file.text();
        const parsed = parser.parseFromString(text, "application/xml");
        if (parsed.getElementsByTagName("parsererror").length || !parsed.documentElement || parsed.documentElement.tagName !== "directory") {
            alert("File XML không hợp lệ. Vui lòng chọn file có thẻ gốc <directory>.");
            return;
        }
        xmlDoc = parsed;
        openedFileHandle = handle;
        const ids = Array.from(xmlDoc.getElementsByTagName("contact"))
            .map(c => Number(c.getAttribute("id"))).filter(Number.isFinite);
        contactIdCounter = Math.max(0, ...ids) + 1;
        cancelEdit();
        displayContacts();
        setStatus("Đã mở " + file.name + ". Các thay đổi có thể lưu trực tiếp vào chính file này.");
    } catch (error) {
        if (error && error.name !== "AbortError") alert("Không thể mở file: " + error.message);
    }
}

async function saveXMLToOpenedFile() {
    let xmlContent = new XMLSerializer().serializeToString(xmlDoc);

// Xóa dòng khai báo XML nếu đã có
xmlContent = xmlContent.replace(
    /^\s*<\?xml[^?]*\?>\s*/i, ""
);

const xmlText =
    '<?xml version="1.0" encoding="UTF-8"?>\n' + xmlContent;
    if (openedFileHandle) {
        try {
            if (openedFileHandle.requestPermission) {
                let permission = await openedFileHandle.queryPermission({ mode: "readwrite" });
                if (permission !== "granted") permission = await openedFileHandle.requestPermission({ mode: "readwrite" });
                if (permission !== "granted") {
                    alert("Bạn chưa cấp quyền ghi file. Hãy cấp quyền rồi thử lưu lại.");
                    return;
                }
            }
            const writable = await openedFileHandle.createWritable();
            await writable.write(xmlText);
            await writable.close();
            setStatus("Đã lưu thành công vào file XML đã mở: " + openedFileHandle.name);
            alert("Đã lưu dữ liệu mới vào chính file XML đã đọc!");
            return;
        } catch (error) {
            alert("Không thể ghi vào file đã mở: " + error.message + "\nBạn có thể dùng nút Tải file XML để xuất bản cập nhật.");
            return;
        }
    }
    alert("File được chọn qua ô tải file thông thường không cấp quyền ghi đè. Chương trình sẽ tải xuống file XML đã cập nhật; bạn hãy lưu đè lên file cũ nếu muốn.");
    downloadXML();
}

function readXMLFile() {
    const file = document.getElementById("xml-file").files[0];
    if (!file) return alert("Vui lòng chọn một tập tin XML trước!");
    const reader = new FileReader();
    reader.onload = function(event) {
        const parsed = parser.parseFromString(event.target.result, "application/xml");
        if (parsed.getElementsByTagName("parsererror").length || !parsed.documentElement ||
            parsed.documentElement.tagName !== "directory") {
            alert("File XML không hợp lệ. Vui lòng chọn file có thẻ gốc <directory>.");
            return;
        }
        xmlDoc = parsed;
        const ids = Array.from(xmlDoc.getElementsByTagName("contact"))
            .map(c => Number(c.getAttribute("id"))).filter(Number.isFinite);
        contactIdCounter = Math.max(0, ...ids) + 1;
        cancelEdit();
        displayContacts();
        setStatus("Đã đọc file " + file.name + " thành công.");
    };
    reader.onerror = () => alert("Không thể đọc tập tin. Vui lòng thử lại.");
    reader.readAsText(file, "UTF-8");
}
function downloadXML() {
    const serializer = new XMLSerializer();
    const xmlText = '<?xml version="1.0" encoding="UTF-8"?>\n' + serializer.serializeToString(xmlDoc);
    const blob = new Blob([xmlText], {type: "application/xml;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "contacts.xml";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
}
document.getElementById("contact-form").addEventListener("submit", addOrUpdateContact);
displayContacts();
</script>
</body>
</html>
